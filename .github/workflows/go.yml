# =============================================================================
# go_admin CI / Release
# =============================================================================
# CI：PR 与 main/master 推送 → 校验、lint、测试、跨平台构建
# Release：仅 push 语义化标签 v* 时创建 GitHub Release（附跨平台二进制）
#
# 发版：
#   make release VERSION=1.2.0
#   # 等价：git tag -a v1.2.0 -m v1.2.0 && git push origin v1.2.0
# =============================================================================


name: Go CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# 默认只读；release job 单独提权
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Install tooling
        run: make deps

      - name: Format check
        run: make fmt-check

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      # GOOS/GOARCH 交叉编译即可，无需 macos/windows runner
      - name: Cross-build
        run: make cross-build
        env:
          GOFLAGS: -mod=readonly

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: go_admin-binaries
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub Release
    needs: ci
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: go_admin-binaries
          path: dist/

      - name: Collect release assets
        id: assets
        run: |
          set -euo pipefail
          mkdir -p dist/final
          # 只收跨平台产物，避免把目录噪声打进 Release
          find dist -type f \( -name 'go_admin-*' -o -name 'go_admin-*.exe' \) -print0 \
            | while IFS= read -r -d '' f; do
                cp -f "$f" dist/final/
              done
          count="$(find dist/final -type f | wc -l | tr -d ' ')"
          echo "asset count=${count}"
          ls -lh dist/final/
          if [ "${count}" -lt 1 ]; then
            echo "no release binaries found under dist/" >&2
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: dist/final/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
