receivers:
  otlp:
    # 接收 OpenTelemetry Protocol (OTLP) 格式的遥测数据，支持 gRPC 和 HTTP 协议
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"          # 监听 gRPC 协议的 OTLP 数据，容器内端口
        read_buffer_size: 524288          # 读取缓冲区大小（512KiB），提高大流量下的接收稳定性
        max_recv_msg_size_mib: 16         # 最大接收消息大小（16MiB），支持较大的跨度数据
      http:
        endpoint: "0.0.0.0:4318"          # 监听 HTTP 协议的 OTLP 数据，容器内端口
        cors:
          allowed_origins:
            - "*"                        # 允许所有来源的跨域请求，便于本地调试

processors:
  batch:
    # 批处理处理器，将多个跨度合并发送，平衡性能和延迟
    timeout: 1s                       # 批处理超时时间，1秒未达到批量大小时强制发送
    send_batch_size: 100               # 每次发送的最大跨度数，推荐值（兼顾延迟和吞吐量）
    send_batch_max_size: 200           # 批处理的最大跨度数，防止内存占用过高
  resource:
    # 只补充环境标签；保留应用侧设置的 service.name（勿覆盖，否则 Jaeger 服务列表对不上）
    attributes:
      - key: deployment.environment
        value: "local"
        action: upsert

exporters:
  # Jaeger 1.35+ 原生收 OTLP；旧 jaeger exporter（打 14250）已废弃且与 OTLP 端口冲突
  otlp/jaeger:
    endpoint: "jaeger:4317"
    tls:
      insecure: true
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 1000
  debug:
    # 替代已移除的 logging exporter（Collector ≥0.100）
    verbosity: normal
    sampling_initial: 5
    sampling_thereafter: 20

extensions:
  # 浏览器可打开：http://127.0.0.1:13133/（compose 映射到宿主机）
  health_check:
    endpoint: "0.0.0.0:13133"
  pprof:
    endpoint: "0.0.0.0:1777"
  # 调试页：http://127.0.0.1:55679/debug/tracez
  zpages:
    endpoint: "0.0.0.0:55679"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [otlp/jaeger, debug]
  telemetry:
    metrics:
      address: "0.0.0.0:8888"
      level: detailed
    logs:
      level: info
      encoding: console
  extensions:
    - health_check
    - pprof
    - zpages
