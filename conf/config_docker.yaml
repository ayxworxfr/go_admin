server:
  port: 8888

database:
  host: mysql               # Docker容器名称；可由 DATABASE_HOST 覆盖
  port: 3306                # DATABASE_PORT
  user: go_user             # DATABASE_USER
  password: ""              # 密钥：DATABASE_PASSWORD（compose/.env 注入）
  dbname: go_admin          # DATABASE_NAME
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 3600   # 1 hour in seconds
  show_sql: false

# Redis配置
redis:
  host: redis               # Docker容器名称；REDIS_HOST
  port: 6379                # REDIS_PORT
  password: ""              # 密钥：REDIS_PASSWORD（无密码留空）
  db: 0
  pool_size: 10
  min_idle_conns: 5

jwt:
  secret: ""                # 密钥：JWT_SECRET（compose/.env 注入，勿写明文）
  access_token_exp: 8h
  refresh_token_exp: 7d
  # Docker 多副本用 redis 共享撤销名单
  token_store:
    driver: redis
    key_prefix: "go_admin:jwt:revoked:"

logger:
  log_file: "./logs/app.log"
  level: "info"
  max_size: 100             # 100 MB
  max_backups: 3
  max_age: 28               # 28 days
  compress: true
  console: true

opentelemetry:
  enable: true              # 启用OpenTelemetry
  service: go-admin-scaffold # 服务名称
  endpoint: otel-collector:4317 # 指向Collector容器
  protocol: grpc            # 协议
  sampling: 1.0             # 开发环境建议全采样
  timeout: 5                # 超时时间5秒

tasks:
  - name: health_task
    cron_expr: "*/5 * * * *" # 每5分钟执行一次健康检查
    disabled: false
